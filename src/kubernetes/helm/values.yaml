# Monolith configuration
monolith:
  enabled: true
  image:
    repository: ghcr.io/rminchakov-ctrl/cinemaabyss/monolith
    tag: latest
    pullPolicy: Always
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  service:
    port: 8080
    targetPort: 8080
    type: ClusterIP
  podAnnotations:
    sidecar.istio.io/inject: "true"
    proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
    traffic.sidecar.istio.io/includeOutboundPorts: "8080"

# Proxy service configuration
proxyService:
  enabled: true
  image:
    repository: ghcr.io/rminchakov-ctrl/cinemaabyss/proxy-service
    tag: latest
    pullPolicy: Always
  replicas: 1
  resources:
    limits:
      cpu: 300m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  service:
    port: 80
    targetPort: 8000
    type: ClusterIP
  env:
    GRADUAL_MIGRATION: "true"
    MOVIES_MIGRATION_PERCENT: "50"

# Movies service configuration
moviesService:
  enabled: true
  image:
    repository: ghcr.io/rminchakov-ctrl/cinemaabyss/movies-service
    tag: latest
    pullPolicy: Always
  replicas: 1
  resources:
    limits:
      cpu: 300m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  service:
    port: 8081
    targetPort: 8081
    type: ClusterIP
  podAnnotations:
    sidecar.istio.io/inject: "true"
    proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
    traffic.sidecar.istio.io/includeOutboundPorts: "8080"

# Events service configuration
eventsService:
  enabled: true
  image:
    repository: ghcr.io/rminchakov-ctrl/cinemaabyss/events-service
    tag: latest
    pullPolicy: Always
  replicas: 1
  resources:
    limits:
      cpu: 300m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  service:
    port: 8082
    targetPort: 8082
    type: ClusterIP

# Kafka configuration
kafka:
  nameOverride: "kbroker"
  enabled: true
  service:
    type: ClusterIP
    port: 9092
  image:
    repository: confluentinc/cp-kafka
    tag: 7.6.0
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    limits:
      cpu: 50m
      memory: 1Gi
    requests:
      cpu: 30m
      memory: 512Mi
  persistence:
    enabled: true
    size: 5Gi
    accessMode: ReadWriteOnce
  topics:
    - name: movie-events
      partitions: 1
      replicationFactor: 1
    - name: user-events
      partitions: 1
      replicationFactor: 1
    - name: payment-events
      partitions: 1
      replicationFactor: 1
  configuration:
    env:
      KAFKA_MODE: "kafka"
      KAFKA_BROKER_ID: "1"
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENERS: "PLAINTEXT://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kbroker:9092"
      KAFKA_LOG_DIRS: "/kafka/kafka-logs"
    override:
      server.properties: |
        broker.id=1
        listeners=PLAINTEXT://:9092
        advertised.listeners=PLAINTEXT://kbroker:9092
        zookeeper.connect=zookeeper:2181
        zookeeper.connection.timeout.ms=30000
  extraInitContainers:
    - name: wait-for-zookeeper
      image: busybox:1.28
      command: ['sh', '-c', 'until nslookup zookeeper; do echo "Waiting for Zookeeper..."; sleep 2; done']  

# Zookeeper configuration
zookeeper:
  enabled: true
  image:
    repository: confluentinc/cp-zookeeper
    tag: 7.6.0
    pullPolicy: IfNotPresent    
  replicas: 1
  resources:
    limits:
      cpu: 50m
      memory: 512Mi
    requests:
      cpu: 10m
      memory: 256Mi
  persistence:
    enabled: true
    size: 1Gi
    accessMode: ReadWriteOnce
  config:
    clientPort: 2181
    tickTime: 2000
    dataDir: /var/lib/zookeeper/data
    maxClientCnxns: 60  

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: cinemaabyss.example.com
      paths:
        - path: /
          pathType: Prefix
          service: proxy-service
          port: 80
        - path: /api/events
          pathType: Prefix
          service: events-service
          port: 8082

# Application configuration
config:
  # Strangler Fig configuration
  gradualMigration: "true"
  moviesMigrationPercent: "100"
